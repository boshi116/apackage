concurrency:
  group: my-packages
  cancel-in-progress: true

on:
  push:
    paths:
      - '.github/workflows/merge.yml'
  schedule:
    - cron: '0 */13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: ''

      - name: 重置并清理工作区
        run: |
          git reset --hard HEAD
          git clean -ffdx -e .git -e .github -e README.md -e .gitignore
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf jell_tmp tmp_jell .git/modules/* 2>/dev/null || true

      - name: 强制拉取最新代码
        run: |
          git pull --force --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main

      - name: 设置 Git 和环境
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: 下载插件到根目录
        id: download
        shell: bash
        run: |
          set -uo pipefail
          
          DOWNLOAD_DIR=$(mktemp -d)
          trap "rm -rf $DOWNLOAD_DIR" EXIT
          
          git_clone() {
            local repo="$1"
            local dir="$2"
            local target="${DOWNLOAD_DIR}/${dir}"
            echo "🔄 正在克隆: $dir"
            if git clone --depth 1 "$repo" "$target" 2>&1; then
              echo "✅ 成功克隆: $dir"
              return 0
            else
              echo "⚠️ 警告: 克隆 $dir 失败，跳过"
              return 1
            fi
          }
          
          special_downloads() {
            echo "🔄 处理特殊仓库: vlmcsd"
            if tmpdir=$(mktemp -d); then
              if git clone --depth 1 https://github.com/gaoderby/luci-app-kms "$tmpdir/kms" 2>/dev/null; then
                cp -r "$tmpdir/kms/luci/applications/luci-app-vlmcsd" "${DOWNLOAD_DIR}/luci-app-vlmcsd" 2>/dev/null || true
                cp -r "$tmpdir/kms/package/network/vlmcsd" "${DOWNLOAD_DIR}/vlmcsd" 2>/dev/null || true
                echo "✅ 成功处理: vlmcsd"
              else
                echo "⚠️ 警告: 处理 vlmcsd 失败"
              fi
              rm -rf "$tmpdir"

            fi
            
            echo "🔄 处理特殊仓库: jell"
            if tmpdir=$(mktemp -d); then
              if git clone --depth 1 https://github.com/kenzok8/jell "$tmpdir/jell" 2>/dev/null; then
                for item in luci-app-aria2 luci-app-ipsec-server luci-app-pptpd webdav2 luci-app-msd_lite luci-app-onliner msd_lite unishare luci-app-unishare luci-app-rtbwmon luci-app-kodexplorer; do
                  if [ -d "$tmpdir/jell/$item" ]; then
                    cp -r "$tmpdir/jell/$item" "${DOWNLOAD_DIR}/$item"
                  fi
                done
                echo "✅ 成功处理: jell"
              else
                echo "⚠️ 警告: 处理 jell 失败"
              fi
              rm -rf "$tmpdir"
              
             fi

            echo "🔄 处理特殊仓库: adblock‑fast + luci‑app‑adblock‑fast (openwrt‑24.10 sparse-checkout)"
            if tmpdir=$(mktemp -d); then
                backend_ok=0
                luci_ok=0

                #===== 后端 adblock‑fast packages/net/adblock‑fast =====
                mkdir -p "$tmpdir/packages"
                pushd "$tmpdir/packages" >/dev/null
                git init
                git remote add origin https://github.com/openwrt/packages
                git config core.sparseCheckout true
                echo "net/adblock-fast" >> .git/info/sparse-checkout
                git pull --depth 1 origin openwrt-24.10 2>/dev/null
                popd >/dev/null

                if [ -d "$tmpdir/packages/net/adblock-fast" ];then
                    cp -r "$tmpdir/packages/net/adblock-fast" "${DOWNLOAD_DIR}/adblock-fast" 2>/dev/null || true
                    backend_ok=1
                    echo "✅ 后端 adblock‑fast 复制完成"
                else
                    echo "⚠️ 警告: 获取 adblock‑fast 后端失败"
                fi

                #===== 前端 luci‑app‑adblock‑fast applications/luci‑app‑adblock‑fast =====
                mkdir -p "$tmpdir/luci"
                pushd "$tmpdir/luci" >/dev/null
                git init
                git remote add origin https://github.com/openwrt/luci
                git config core.sparseCheckout true
                echo "applications/luci-app-adblock-fast" >> .git/info/sparse-checkout
                git pull --depth 1 origin openwrt-24.10 2>/dev/null
                popd >/dev/null

                if [ -d "$tmpdir/luci/applications/luci-app-adblock-fast" ];then
                    cp -r "$tmpdir/luci/applications/luci-app-adblock-fast" "${DOWNLOAD_DIR}/luci-app-adblock-fast" 2>/dev/null || true
                    luci_ok=1
                    echo "✅ 界面 luci‑app‑adblock‑fast 复制完成"
                else
                    echo "⚠️ 警告: 获取 luci‑app‑adblock‑fast 界面失败"
                fi

                if [ $backend_ok -eq 1 ] && [ $luci_ok -eq 1 ]; then
                    echo "🎉 adblock‑fast 整套处理全部成功"
                fi
                rm -rf "$tmpdir"
            fi
            
            return 0
          }
          
          echo "🚀 开始并行下载..."
          
          (
            # 批次1
            git_clone "https://github.com/kiddin9/luci-app-dnsfilter" "luci-app-dnsfilter" || true
            git_clone "https://github.com/kiddin9/aria2" "aria2" || true
            git_clone "https://github.com/kiddin9/autoshare" "autoshare" || true
            git_clone "https://github.com/kiddin9/luci-app-wizard" "luci-app-wizard" || true
            git_clone "https://github.com/riverscn/openwrt-iptvhelper" "openwrt-iptvhelper" || true
            git_clone "https://github.com/kongfl888/luci-app-timedreboot" "luci-app-timedreboot" || true
            git_clone "https://github.com/destan19/OpenAppFilter" "OpenAppFilter" || true
            git_clone "https://github.com/upcliujie/luci-app-tcpdump" "luci-app-tcpdump" || true
            git_clone "https://github.com/IamJasperJ/luci-app-traffic-statistic" "luci-app-traffic-statistic" || true
            git_clone "https://github.com/destan19/luci-app-harbor-file" "luci-app-harbor-file" || true
            git_clone "https://github.com/migee99/luci-app-clientstatus" "luci-app-clientstatus" || true
          ) &
          PID1=$!
          
          (
            # 批次2
            git_clone "https://github.com/gaobin89/luci-app-timecontrol" "luci-app-timecontrol" || true
            git_clone "https://github.com/mokesher/luci-app-dashboard" "luci-app-dashboard" || true
            git_clone "https://github.com/sirpdboy/luci-app-advancedplus" "luci-app-advancedplus" || true
            git_clone "https://github.com/sirpdboy/luci-app-partexp" "luci-app-partexp" || true
            git_clone "https://github.com/sirpdboy/netspeedtest" "netspeedtest" || true
            git_clone "https://github.com/sirpdboy/luci-app-watchdog" "luci-app-watchdog" || true
            git_clone "https://github.com/sirpdboy/luci-app-parentcontrol" "luci-app-parentcontrol" || true
            git_clone "https://github.com/sirpdboy/luci-app-eqosplus" "luci-app-eqosplus" || true
            git_clone "https://github.com/sirpdboy/luci-app-taskplan" "luci-app-taskplan" || true
            git_clone "https://github.com/sirpdboy/luci-app-netwizard" "luci-app-netwizard" || true
            git_clone "https://github.com/gdy666/luci-app-lucky" "luci-app-lucky" || true
          ) &
          PID2=$!
          
          (
            # 批次3
            git_clone "https://github.com/brvphoenix/luci-app-wrtbwmon" "luci-app-wrtbwmon" || true
            git_clone "https://github.com/brvphoenix/wrtbwmon" "wrtbwmon" || true
            git_clone "https://github.com/sbwml/luci-app-mosdns" "luci-app-mosdns" || true
            git_clone "https://github.com/UnblockNeteaseMusic/luci-app-unblockneteasemusic" "luci-app-unblockneteasemusic" || true
            git_clone "https://github.com/sbwml/luci-app-quickfile" "luci-app-quickfile" || true
            git_clone "https://github.com/tty228/luci-app-wechatpush" "luci-app-wechatpush" || true
            git_clone "https://github.com/ZeaKyX/speedtest-web" "speedtest-web" || true
            git_clone "https://github.com/ZeaKyX/luci-app-speedtest-web" "luci-app-speedtest-web" || true
            git_clone "https://github.com/vernesong/OpenClash" "OpenClash" || true
          ) &
          PID3=$!
          
          (
            # 批次4
            git_clone "https://github.com/ilxp/luci-app-ikoolproxy" "luci-app-ikoolproxy" || true
            git_clone "https://github.com/EasyTier/luci-app-easytier" "luci-app-easytier" || true
            git_clone "https://github.com/stackia/rtp2httpd" "rtp2httpd" || true
            git_clone "https://github.com/jerrykuku/luci-app-argon-config" "luci-app-argon-config" || true
            git_clone "https://github.com/jerrykuku/luci-theme-argon" "luci-theme-argon" || true
            git_clone "https://github.com/gaoyaxuan/luci-app-pushbot" "luci-app-pushbot" || true
            git_clone "https://github.com/nooblk-98/luci-app-netstat" "luci-app-netstat" || true
            git_clone "https://github.com/nooblk-98/luci-theme-noobwrt" "luci-theme-noobwrt" || true
            git_clone "https://github.com/qimaoww/luci-app-lanspeed" "luci-app-lanspeed" || true
            git_clone "https://github.com/Natduki/luci-app-sqm-controller" "luci-app-sqm-controller" || true
          ) &
          PID4=$!
          
          (
            # 批次5
            git_clone "https://github.com/kenzok78/luci-app-adguardhome" "luci-app-adguardhome" || true
            git_clone "https://github.com/pymumu/luci-app-smartdns" "luci-app-smartdns" || true
            git_clone "https://github.com/pymumu/openwrt-smartdns" "smartdns" || true
            git_clone "https://github.com/Openwrt-Passwall/openwrt-passwall" "openwrt-passwall" || true
            git_clone "https://github.com/timsaya/luci-app-bandix" "luci-app-bandix" || true
            git_clone "https://github.com/timsaya/openwrt-bandix" "openwrt-bandix" || true
            git_clone "https://github.com/timsaya/luci-app-bandix-plus" "luci-app-bandix-plus" || true
            git_clone "https://github.com/timsaya/openwrt-bandix-plus" "openwrt-bandix-plus" || true
            git_clone "https://github.com/huchd0/luci-app-netwiz" "luci-app-netwiz" || true
            git_clone "https://github.com/tpxcer/luci-app-minigate" "luci-app-minigate" || true
          ) &
          PID5=$!
          
          (special_downloads) &
          PID6=$!
          
          echo "⏳ 等待所有下载任务完成..."
          wait $PID1 $PID2 $PID3 $PID4 $PID5 $PID6
          
          echo "📊 所有下载任务已完成"
          echo "📦 下载目录内容:"
          ls -la "$DOWNLOAD_DIR" || echo "下载目录为空或不存在"
          
          echo "🧹 清理旧文件..."
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name '.gitignore' -exec rm -rf {} + 2>/dev/null || true
          
          if [ -d "$DOWNLOAD_DIR" ] && [ "$(ls -A "$DOWNLOAD_DIR" 2>/dev/null)" ]; then
            echo "📁 移动新文件到工作目录..."
            shopt -s dotglob
            for item in "$DOWNLOAD_DIR"/*; do
              if [ -e "$item" ]; then
                cp -r "$item" . 2>/dev/null || true
              fi
            done
            shopt -u dotglob
          else
            echo "⚠️ 警告: 下载目录为空，可能所有下载都失败了"
          fi
          
          echo "🧹 清理子目录中的 .git 文件夹..."
          find . -mindepth 2 -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          find . -mindepth 2 -type f -name "README.md" ! -path "./README.md" -delete 2>/dev/null || true
          find . -mindepth 2 -type f -name "LICENSE" -delete 2>/dev/null || true
          
          echo "✅ 下载完成"
          echo "当前目录内容："
          ls -la

      - name: 提交并推送更新
        run: |
          if [ ! -d ".git" ]; then
            echo "❌ 错误：.git 目录不存在"
            exit 1
          fi
          
          CHANGES=$(git status --porcelain)
          
          if [ -z "$CHANGES" ]; then
            echo "ℹ️ 无文件变更，跳过提交"
            exit 0
          fi
          
          echo "📤 检测到更新："
          echo "$CHANGES"
          
          UPDATE_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          FILE_COUNT=$(echo "$CHANGES" | wc -l)
          
          PLUGINS=$(echo "$CHANGES" | awk '{print $2}' | grep -v '^README.md$' | sed 's|^\./||' | cut -d'/' -f1 | sort -u | grep -v '^$' | sed 's/^/  - `/; s/$/`/')
          
          cat > README.md << EOF
          ## 📦 自用包自动更新
          
          - **更新时间**：${UPDATE_TIME}
          - **更新文件数**：${FILE_COUNT}
          - **更新插件**：
          ${PLUGINS:-  - 配置文件更新}
          
          ---
          
          本仓库由 GitHub Actions 自动维护，每13小时检查一次更新。
          EOF
          
          git add -A
          git commit -m "📦 自动更新 - ${UPDATE_TIME}" || exit 0
          
          for i in 1 2 3; do
            if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main; then
              echo "✅ 推送成功"
              exit 0
            fi
            echo "⚠️ 推送失败，${i}/3 重试..."
            sleep 5
            git fetch origin main && git rebase origin/main || true
          done
          
          echo "❌ 推送失败"
          exit 1
