name: Build and Release OpenWrt LuCI IPK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build LuCI IPK Package
        run: |
          chmod +x ./build_ipk.sh
          rm -rf bin
          mkdir -p bin
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            bash ./build_ipk.sh "${{ github.ref_name }}"
          else
            bash ./build_ipk.sh
          fi

      - name: Generate Checksums
        run: |
          cd bin
          sha256sum *.ipk > sha256sums.txt
          cat sha256sums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-modem-redial-ipk
          path: |
            bin/*.ipk
            bin/sha256sums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.ipk
            bin/sha256sums.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
