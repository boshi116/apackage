name: Check and build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - name: Test RPC and configuration migration on OpenWrt
        run: |
          for release in 25.12.6 24.10.8; do
            docker run --rm -v "$PWD:/src:ro" "openwrt/rootfs:x86-64-$release" sh /src/tests/openwrt.sh
          done

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: x86-64-25.12.6
            format: apk
          - sdk: x86-64-24.10.8
            format: ipk
    steps:
      - uses: actions/checkout@v4
      - name: Build with the matching stable SDK
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          mkdir -p bin
          docker run --rm --user root -e FORCE_UNSAFE_CONFIGURE=1 \
            -v "$PWD:/src:ro" -v "$PWD/bin:/builder/bin" \
            "openwrt/sdk:$SDK" /bin/sh /src/.github/workflows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: argon-config-${{ matrix.format }}
          path: bin/packages/**/*argon-config*.${{ matrix.format }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildlog-${{ matrix.format }}
          path: bin/logs.tar.xz
          if-no-files-found: ignore
