name: Release

on:
  push:
    tags: ['v*', 'release-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching Makefile, e.g. v2.1.0 or v2.1.0-r1'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/check.yml
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: argon-config-*
          path: packages
          merge-multiple: true
      - name: Publish APK and IPK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/workflows/publish.sh
