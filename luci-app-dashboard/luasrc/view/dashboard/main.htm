<%+header%>
<link rel="stylesheet" href="/luci-static/dashboard/dashboard.css">
<style>
/* ============== Dashboard 视觉美化：调大字体 ============== */
.dash-tailwind-scope {
  --dash-label: 0.9375rem;    /* 卡片标签：15px */
  --dash-value: 1.75rem;       /* 大数值：28px */
  --dash-sub: 0.875rem;        /* 辅助/单位：14px */
  --dash-meta: 0.8125rem;      /* 元信息：13px */
  --dash-traffic: 1rem;        /* 实时速率：16px */
  --dash-tiny: 0.75rem;        /* 最小可读：12px */
  --dash-section: 1.125rem;    /* 章节标题：18px */
}

/* --- 顶部概览卡片 --- */
.dash-tailwind-scope #internet-status-text {
  font-size: 1.25rem !important;
  font-weight: 700 !important;
}
.dash-tailwind-scope #internet-status-desc {
  font-size: var(--dash-sub) !important;
}
.dash-tailwind-scope > main > div:first-child > div > div:first-child > span,
.dash-tailwind-scope > main > div:first-child > div span.text-sm.font-medium {
  font-size: var(--dash-label) !important;
  color: #475569;
  font-weight: 500;
}
.dash-tailwind-scope #summary-devices,
.dash-tailwind-scope #summary-connections,
.dash-tailwind-scope #summary-rx,
.dash-tailwind-scope #summary-tx {
  font-size: var(--dash-value) !important;
  font-weight: 700 !important;
  line-height: 1.1;
}
.dash-tailwind-scope #summary-rx-unit,
.dash-tailwind-scope #summary-tx-unit,
.dash-tailwind-scope .dash-summary-unit,
.dash-tailwind-scope span.text-sm.text-gray-400.mb-1 {
  font-size: var(--dash-sub) !important;
  font-weight: 500;
}
.dash-tailwind-scope > main > div:first-child > div > span.text-xs.text-gray-400.mt-1 {
  font-size: var(--dash-meta) !important;
}

/* --- 红框：实时网络速率（下载/上传） --- */
.dash-tailwind-scope .text-\[10px\].text-gray-500.flex.space-x-4.bg-gray-50.px-3.py-1\.5.rounded-lg.border.border-gray-100 {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 1rem !important;
  border-radius: 12px !important;
  background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%) !important;
  border: 1px solid #dbe3ec !important;
  font-size: var(--dash-traffic) !important;
}
.dash-tailwind-scope .text-\[10px\].text-gray-500.flex.space-x-4.bg-gray-50.px-3.py-1\.5.rounded-lg.border.border-gray-100 > div {
  display: inline-flex;
  align-items: center;
  font-size: var(--dash-traffic) !important;
  font-weight: 600;
  color: #334155;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.dash-tailwind-scope .text-\[10px\].text-gray-500.flex.space-x-4.bg-gray-50.px-3.py-1\.5.rounded-lg.border.border-gray-100 > div > .text-blue-500 {
  font-size: 1.15rem !important;
}

}

  font-weight: 700;

}

/* --- 卡片标题 --- */

/* ============== Dashboard 暗黑模式适配 ============== */

/* 先定义一套亮/暗 CSS 变量（默认亮） */
:root,
:root[data-theme="light"],
:root[theme="light"],
:root:not([data-theme]):not([theme]) {
  --dash-bg: #f4f6f8;
  --dash-card: #ffffff;
  --dash-card-border: #f3f4f6;
  --dash-muted: #64748b;
  --dash-text: #1e293b;
  --dash-text-2: #334155;
  --dash-divider: #f1f5f9;
  --dash-soft: #f8fafc;
  --dash-soft-border: #e2e8f0;
  --dash-inactive: #94a3b8;
}

/* Aurora: <html theme="dark"> 或 <html data-theme="dark"> */
:root[data-theme="dark"],
:root[theme="dark"] {
  --dash-bg: #0b0d12;
  --dash-card: #151922;
  --dash-card-border: #232a38;
  --dash-muted: #94a3b8;
  --dash-text: #e2e8f0;
  --dash-text-2: #cbd5e1;
  --dash-divider: #232a38;
  --dash-soft: #1c2230;
  --dash-soft-border: #2d3648;
  --dash-inactive: #64748b;
}

/* 兜底：系统暗黑 / 部分主题用 body.dark */
@media (prefers-color-scheme: dark) {
  :root {
    --dash-bg: #0b0d12;
    --dash-card: #151922;
    --dash-card-border: #232a38;
    --dash-muted: #94a3b8;
    --dash-text: #e2e8f0;
    --dash-text-2: #cbd5e1;
    --dash-divider: #232a38;
    --dash-soft: #1c2230;
    --dash-soft-border: #2d3648;
    --dash-inactive: #64748b;
  }
}

/* dash 容器背景/文字 */
.dash-tailwind-scope {
  background-color: var(--dash-bg) !important;
  color: var(--dash-text) !important;
}

/* 白色卡片 → 暗色卡片 */

/* 图表容器 */
.dash-tailwind-scope #traffic-line-chart {

<div class="dash-tailwind-scope bg-[#f4f6f8] font-sans text-gray-800 min-h-screen -mx-4 -mt-4 p-4">
    <main class="max-w-[1400px] mx-auto p-2 mt-2 flex flex-col gap-6">

        <!-- 顶部核心数据概览 -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 lg:gap-6 flex-none">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col justify-center transition-all hover:shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-500">网络状态</span>
                    <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                </div>
                <div class="flex items-end gap-2">
                    <span class="text-xl font-bold text-gray-800" id="internet-status-text">检查中</span>
                </div>
                <span class="text-xs text-gray-400 mt-1" id="internet-status-desc">等待数据...</span>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col justify-center transition-all hover:shadow-md">

                    <span class="text-sm font-medium text-gray-500">在线设备</span>
                    <i data-lucide="users" class="w-4 h-4 text-blue-500"></i>
                </div>
                <div class="flex items-end gap-1">
                    <span class="text-2xl font-bold text-gray-800" id="summary-devices">0</span>
                    <span class="text-sm text-gray-400 mb-1">台</span>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col justify-center transition-all hover:shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-500">当前连接</span>
                    <i data-lucide="link" class="w-4 h-4 text-indigo-500"></i>
                </div>
                <div class="flex items-end gap-1">
                    <span class="text-2xl font-bold text-gray-800" id="summary-connections">0</span>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col justify-center transition-all hover:shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-500">总计下载</span>
                    <i data-lucide="download" class="w-4 h-4 text-blue-500"></i>

                <div class="flex items-end gap-1">
                    <span class="text-2xl font-bold text-gray-800" id="summary-rx">0</span>
                    <span class="text-sm text-gray-400 mb-1" id="summary-rx-unit">B</span>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col justify-center transition-all hover:shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-500">总计上传</span>
                    <i data-lucide="upload" class="w-4 h-4 text-emerald-500"></i>
                </div>
                <div class="flex items-end gap-1">
                    <span class="text-2xl font-bold text-gray-800" id="summary-tx">0</span>
                    <span class="text-sm text-gray-400 mb-1" id="summary-tx-unit">B</span>
                </div>
            </div>
        </div>

        <!-- 第一排：网络接口状态 + 实时流量 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch flex-none">
            <div class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full min-h-[220px]">
                <div class="px-5 py-4 border-b border-gray-50 flex items-center space-x-2 flex-none">
                    <i data-lucide="globe" class="text-blue-500 w-[18px] h-[18px]"></i>
                    <h2 class="font-medium text-gray-700 m-0">网络接口状态</h2>
                </div>
                <div class="p-5 flex-1 flex flex-col justify-evenly space-y-3">
                    <div class="flex justify-between items-center">
                        <div class="text-sm text-gray-500">WAN口 IP</div>
                        <div class="font-medium text-gray-800 flex items-center" id="wan-container">
                            <span id="wan-status-dot" class="w-2 h-2 rounded-full bg-green-500 mr-2 shadow-[0_0_8px_rgba(34,197,94,0.6)] hidden"></span>
                            <span id="wan-ip">-</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-sm text-gray-500">局域网 IP</div>
                        <div class="font-medium text-gray-800" id="lan-ip">-</div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-sm text-gray-500">网关</div>
                        <div class="font-medium text-gray-800" id="gateway">-</div>
                    </div>
                    <div class="flex justify-between items-start">
                        <div class="text-sm text-gray-500">DNS<span class="text-xs ml-1">(自动)</span></div>
                        <div class="font-medium text-gray-800 text-right text-xs" id="dns-servers">-</div>
                    </div>
                    <div class="flex justify-between items-center border-t border-gray-50 pt-2">
                        <div class="text-xs text-gray-500 flex items-center">
                            <i data-lucide="clock" class="w-[12px] h-[12px] mr-1"></i> 在线时间
                        </div>
                        <div class="text-xs font-medium text-blue-600 font-mono m-0" id="network-uptime">-</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-gray-100 p-5 relative overflow-hidden flex flex-col h-full min-h-[300px]">
                <div class="flex items-center justify-between mb-2 flex-none">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="activity" class="text-blue-500 w-[18px] h-[18px]"></i>
                        <h2 class="font-medium text-gray-700 m-0">实时网络流量</h2>
                    </div>
                    <div class="text-[10px] text-gray-500 flex space-x-4 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100">
                        <div><span class="text-blue-500 mr-1">↓</span>下载: <span id="total-down" class="text-blue-600 font-mono font-medium">0 B/s</span></div>
                        <div><span class="text-emerald-500 mr-1">↑</span>上传: <span id="total-up" class="text-emerald-600 font-mono font-medium">0 B/s</span></div>
                    </div>
                </div>
                <div class="w-full flex-1" id="traffic-line-chart"></div>
            </div>
        </div>

        <!-- 第二排已屏蔽（应用分布 / 活跃应用 / 热门域名） -->

        <!-- 第三排：系统信息 + 在线设备 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch flex-1 min-h-0 mb-6">
            
            <!-- 左侧：充当高度标尺 -->
            <div class="lg:col-span-4 flex flex-col gap-6 h-full">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex-1 flex flex-col min-h-[320px]">
                    <div class="px-5 py-4 border-b border-gray-50 flex items-center space-x-2 flex-none mb-0">
                        <i data-lucide="cpu" class="text-purple-500 w-[18px] h-[18px]"></i>
                        <h2 class="font-medium text-gray-700 m-0">系统信息</h2>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between" id="sys-info-box">
                        <div>
                            <div class="flex justify-between items-center text-sm mb-4">
                                <span class="text-gray-500">设备型号</span>
                                <span class="font-medium truncate max-w-[200px] text-right text-xs" id="sys-model">-</span>
                            </div>

                            <div class="pt-1 mb-4">
                                <div class="flex justify-between text-[11px] text-gray-500 mb-1.5">
                                    <span>CPU 使用率</span>
                                    <span id="cpu-text" class="font-medium text-gray-800">0%</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                    <div id="cpu-bar" class="bg-purple-500 h-1.5 rounded-full transition-all duration-500 w-0"></div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <div class="flex justify-between text-[11px] text-gray-500 mb-1.5">
                                    <span>CPU 温度</span>
                                    <span id="cpu-temp" class="font-medium text-orange-500">-</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                    <div id="temp-bar" class="bg-orange-400 h-1.5 rounded-full transition-all duration-500 w-0"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="flex justify-between text-[11px] text-gray-500 mb-1.5">
                                    <span>内存使用</span>
                                    <span id="mem-text" class="font-medium text-gray-800">0%</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                    <div id="mem-bar" class="h-1.5 rounded-full transition-all duration-500 bg-green-500 w-0"></div>
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-gray-50 pt-4 space-y-3 mt-4">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-gray-500 font-mono tracking-tight" id="sys-firmware">-</span>
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-gray-400">
                                <span id="sys-uptime">-</span>
                                <span id="sys-time">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 flex-none shrink-0 h-[88px]">
                    <button type="button" data-nav-target="/cgi-bin/luci/admin/system/admin" class="dash-nav-button bg-white flex flex-col items-center justify-center rounded-xl shadow-sm border border-gray-100 hover:border-blue-200 hover:text-blue-600 transition-all text-gray-600 w-full h-full cursor-pointer focus:outline-none">
                        <i data-lucide="key" class="w-5 h-5 mb-1.5"></i>
                        <span class="text-xs font-medium leading-none">修改密码</span>
                    </button>
                    <button type="button" data-nav-target="/cgi-bin/luci/admin/system" class="dash-nav-button bg-white flex flex-col items-center justify-center rounded-xl shadow-sm border border-gray-100 hover:border-blue-200 hover:text-blue-600 transition-all text-gray-600 w-full h-full cursor-pointer focus:outline-none">
                        <i data-lucide="settings" class="w-5 h-5 mb-1.5"></i>
                        <span class="text-xs font-medium leading-none">系统设置</span>
                    </button>
                </div>
            </div>

            <!-- 右侧：在线设备（实时域名已屏蔽） -->
            <div class="lg:col-span-8 relative min-h-[400px] lg:min-h-0">
                <div class="lg:absolute lg:inset-0 w-full h-full grid grid-cols-1 gap-6">

                    <!-- 在线设备 -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[400px] lg:h-full min-h-0">
                        <div class="px-5 py-4 border-b border-gray-50 flex items-center justify-between flex-none mb-0">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="users" class="w-[18px] h-[18px] text-blue-500"></i>
                                <h2 class="font-medium text-gray-700 m-0">在线设备 <span id="active-device-count" class="text-xs text-blue-400 ml-1">0</span></h2>
                            </div>
                        </div>
                        <div class="p-2 flex-1 overflow-y-auto min-h-0" id="devices-list">
                            <!-- 列表将在此生成 -->
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
</div>

<script src="/luci-static/dashboard/lucide.min.js?v=0.0.12"></script>
<script src="/luci-static/dashboard/echarts.min.js?v=0.0.12"></script>
<script src="/luci-static/dashboard/dashboard-data.js?v=0.0.12"></script>
<script src="/luci-static/dashboard/dashboard.js?v=0.0.12"></script>
<%+footer%>
